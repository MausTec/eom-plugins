name: Release

# Repo-wide release workflow
#
# Packages all plugins and creates a GitHub release.
on:
  push:
    tags: ["release-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. release-2026.11.24"
        required: true

permissions:
  contents: write

env:
  # Plugins that are examples or concepts and aren't released.
  # Space-separated plugin names (the `name` in the compiled plugin.json).
  EXCLUDE: hw-api-smoke-test post-orgasm-torture woah-there-buddy

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^release-[0-9A-Za-z._-]+$'; then
            echo "::error::Release tag '$TAG' must look like release-2026.11.24."
            exit 1
          fi

      # TODO: pin to a release tag (MausTec/mt-sdk/action@v1) once one is published.
      - name: Test
        uses: MausTec/mt-sdk/action@main
        with:
          sdk-version-file: .mt-sdk-version
          command: test

      - name: Package
        run: mt-sdk package

      - name: Prepare release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/prepare-release.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/packages/* \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA"

      # Reserved: publish each plugin's archive from dist/packages to Maus Hub
      # (`mt-sdk release`) once that command is available. Hub versions are per
      # plugin, so that step should skip versions that are already published.
